services:
  # 1. FastAPI REST API Backend
  - type: web
    name: railrakshak-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: AUTHORITY_SECRET_KEY
        generateValue: true
      - key: AUTHORITY_DEMO_PASSWORD
        value: ControlRoom@2026
      - key: CORS_ORIGINS
        value: "*"

  # 2. React Vite Frontend Static Site
  - type: web
    name: railrakshak-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: railrakshak-backend
          property: host
